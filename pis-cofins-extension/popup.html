<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora PIS / COFINS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<header>
  <div class="logo-line">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="2" y="2" width="7" height="7" rx="2" fill="#38bdf8"/>
        <rect x="11" y="2" width="7" height="7" rx="2" fill="#a78bfa"/>
        <rect x="2" y="11" width="7" height="7" rx="2" fill="#34d399"/>
        <rect x="11" y="11" width="7" height="7" rx="2" fill="#fb923c"/>
      </svg>
    </div>
    <div>
      <h1>PIS / COFINS</h1>
      <span class="subtitle">calculadora tributária</span>
    </div>
  </div>
</header>

<div class="card">
  <p class="section-label">Regime tributário</p>
  <div class="regime-grid">
    <label class="regime-btn" id="btn-lp">
      <input type="radio" name="regime" value="lp" checked>
      <span class="regime-name">Lucro Presumido</span>
      <span class="regime-rate">PIS 0,65% · COFINS 3,00%</span>
      <span class="regime-badge badge-cum">cumulativo</span>
    </label>
    <label class="regime-btn" id="btn-lr">
      <input type="radio" name="regime" value="lr">
      <span class="regime-name">Lucro Real</span>
      <span class="regime-rate">PIS 1,65% · COFINS 7,60%</span>
      <span class="regime-badge badge-ncum">não cumulativo</span>
    </label>
  </div>

  <p class="section-label" style="margin-top:20px;">Base de cálculo</p>
  <div class="input-wrap">
    <span class="currency-prefix">R$</span>
    <input type="text" id="base-input" placeholder="0,00" inputmode="numeric" autocomplete="off">
  </div>
  <button class="calc-btn" id="calc-btn">Calcular →</button>
</div>

<div class="results-card" id="results-card">
  <div class="results-header">
    <span class="base-display" id="res-base-label">Base: R$ 0,00</span>
    <span class="regime-tag" id="res-regime-tag">—</span>
  </div>

  <div class="result-row">
    <div class="result-left">
      <div class="dot dot-pis"></div>
      <div>
        <div class="result-label">PIS</div>
        <div class="result-aliquota" id="res-pis-aliq">0,65%</div>
      </div>
    </div>
    <div class="result-value">
      <div class="result-brl brl-pis" id="res-pis">R$ 0,00</div>
      <div class="result-pct" id="res-pis-pct"></div>
    </div>
  </div>

  <div class="result-row">
    <div class="result-left">
      <div class="dot dot-cofins"></div>
      <div>
        <div class="result-label">COFINS</div>
        <div class="result-aliquota" id="res-cofins-aliq">3,00%</div>
      </div>
    </div>
    <div class="result-value">
      <div class="result-brl brl-cofins" id="res-cofins">R$ 0,00</div>
      <div class="result-pct" id="res-cofins-pct"></div>
    </div>
  </div>

  <div class="result-row divider-total">
    <div class="result-left">
      <div class="dot dot-total"></div>
      <div>
        <div class="result-label">Total</div>
        <div class="result-aliquota" id="res-total-aliq">3,65%</div>
      </div>
    </div>
    <div class="result-value">
      <div class="result-brl brl-total" id="res-total">R$ 0,00</div>
    </div>
  </div>
</div>

<div class="history-card" id="history-card">
  <div class="history-header">
    <span class="history-title">Histórico</span>
    <button class="clear-btn" id="clear-btn">Limpar</button>
  </div>
  <ul id="history-list"></ul>
</div>

<footer>
  alíquotas conforme legislação vigente · sem créditos
</footer>

<script src="popup.js"></script>
</body>
</html>
